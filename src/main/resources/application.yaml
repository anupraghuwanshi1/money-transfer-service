spring:
  application:
    name: springbootapp
  datasource:
    url: jdbc:h2:mem:moneytransfer;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  h2:
    console:
      enabled: true

server:
  port: 8080

exchange-rate:
  base-url: https://api.frankfurter.app
  connect-timeout: 5s
  read-timeout: 6s
